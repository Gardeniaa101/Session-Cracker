<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Claude Reset Notifier 설정</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main class="page">
      <header class="header">
        <span class="mark" aria-hidden="true">●</span>
        <div>
          <h1>Claude Reset Notifier 설정</h1>
          <p>세션 갱신 알림 방식을 조정합니다.</p>
        </div>
      </header>

      <form id="settings-form" class="card">
        <section class="field-group">
          <h2>사전 알림</h2>
          <div class="checkbox-list" id="pre-alerts">
            <label><input type="checkbox" data-min="10" checked> 10분 전</label>
            <label><input type="checkbox" data-min="30" checked> 30분 전</label>
            <label><input type="checkbox" data-min="60"> 1시간 전</label>
          </div>
        </section>

        <section class="field-group">
          <label class="field-label" for="polling-interval">폴링 주기</label>
          <select id="polling-interval" name="pollingIntervalSec">
            <option value="10">10초</option>
            <option value="30">30초</option>
            <option value="60">60초</option>
            <option value="120">120초</option>
            <option value="300">300초</option>
          </select>
        </section>

        <section class="field-group split">
          <div>
            <h2>위클리 리셋 알림</h2>
            <p>7일 사용량 갱신 알림을 받습니다.</p>
          </div>
          <label class="switch">
            <input id="weekly-alert" type="checkbox" checked>
            <span></span>
          </label>
        </section>

        <section class="field-group split native-section">
          <div>
            <h2>Native App 연동</h2>
            <p>로컬 macOS 앱으로 세션 정보를 전달합니다.</p>
            <p id="native-help" class="help" hidden>macOS 앱이 실행 중이어야 합니다</p>
          </div>
          <label class="switch">
            <input id="native-app" type="checkbox">
            <span></span>
          </label>
        </section>

        <section class="field-group split">
          <div>
            <h2>알림 소리</h2>
            <p>Chrome 알림에 소리를 사용합니다.</p>
          </div>
          <label class="switch">
            <input id="notification-sound" type="checkbox" checked>
            <span></span>
          </label>
        </section>
      </form>
    </main>

    <div id="toast" role="status" aria-live="polite">설정 저장됨</div>
    <script src="options.js"></script>
  </body>
</html>
